services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: ${CRYPTO_DB_NAME:-crypto_agents}
      POSTGRES_USER: ${CRYPTO_DB_USER:-crypto_agents}
      POSTGRES_PASSWORD: ${CRYPTO_DB_PASSWORD:-crypto_agents_local}
    ports:
      - "127.0.0.1:${CRYPTO_DB_PORT:-5432}:5432"
    volumes:
      - crypto_pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crypto_pgdata:
